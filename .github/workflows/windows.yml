name: Windows build and package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Locked build, tests, and portable ZIP
        run: ./scripts/Package.ps1
      - name: Verify portable ZIP integrity
        run: |
          $package = Get-ChildItem artifacts/packages -Recurse -File -Filter 'AriaGUI-*-win-x64.zip' | Select-Object -First 1
          if (!$package) { throw 'Portable ZIP candidate missing.' }
          ./scripts/Test-PortablePackage.ps1 -PackagePath $package.FullName
      - name: Retain test and profiling results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-test-results
          path: |
            artifacts/test-results/*.trx
            artifacts/phase6-profile.json
            artifacts/packages/**/package-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain portable ZIP and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64-portable-candidate
          path: |
            artifacts/packages/**/*.zip
            artifacts/packages/**/SHA256SUMS.txt
            artifacts/packages/**/package-report.json
          if-no-files-found: error
          retention-days: 14
