<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AriaGUI</title><style>body{font:14px system-ui;min-width:230px;padding:12px}label{display:block;margin:12px 0}#status{font-weight:600}</style></head>
<body><strong>AriaGUI</strong><p id="status" role="status">Checking connection…</p>
<p>When capture is on, download URLs and matching site cookies are sent to the AriaGUI app on this device. AriaGUI keeps URLs in download history, but does not save the cookies. Chrome's copy is removed only after AriaGUI accepts a download.</p>
<label><input id="enabled" type="checkbox"> Capture downloads</label>
<label><input id="site" type="checkbox"> Disable for this site</label>
<script src="popup.js"></script></body></html>
